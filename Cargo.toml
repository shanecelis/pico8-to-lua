[package]
name = "pico8-to-lua"
description = "Converts Pico-8's dialect of Lua to plain Lua"
version = "0.1.1"
edition = "2024"
authors = ["Shane Celis <shane.celis@gmail.com>"]
keywords = [
    "pico-8",
    "gamedev",
]
categories = [
    "game-development"
]
readme = "README.md"
license = "Zlib"
repository = "https://github.com/shanecelis/pico8-to-lua"

[dependencies]
find-matching-bracket = "0.2.0"
lazy-regex = { version = "3.0", default-features = false, features = ["lite"] }
pest = "2.8"
pest_derive = "2.8"
regex-lite = "0.1.6"

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
criterion = "0.8.2"
test-case = "3.4.0"
version-sync = "0.9.5"

[[example]]
name = "check"
test = true

[[bench]]
name = "patch_lua"
harness = false

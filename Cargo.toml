[package]
name = "pico8-to-lua"
description = "Converts Pico-8's Lua dialect to standard Lua"
version = "0.2.0"
edition = "2024"
authors = ["Shane Celis <shane.celis@gmail.com>"]
keywords = [
    "pico-8",
    "gamedev",
]
categories = [
    "game-development"
]
readme = "README.md"
license = "Zlib"
repository = "https://github.com/shanecelis/pico8-to-lua"

[dependencies]
lexopt = { version = "0.3", optional = true }
pest = "2.8"
pest_derive = "2.8"
thiserror = "2"

[features]
default = ["cli"]
cli = ["dep:lexopt"]

[[bin]]
name = "pico8-to-lua"
required-features = ["cli"]

[dev-dependencies]
criterion = "0.8.2"
test-case = "3.4.0"
version-sync = "0.9.5"

[[bench]]
name = "patch_lua"
harness = false
